[tools]
age = "latest"
direnv = "latest"
flux2 = "latest"
kubectl = "latest"
kubens = "latest"
k9s = "latest"
sops = "latest"
github-cli = "latest"
# uv must be present before the pipx: tools below; mise's pipx backend
# uses uvx to install Python tools from prebuilt wheels when it's available.
uv = "latest"
"pipx:pre-commit" = "latest"
"pipx:commitizen" = "latest"
